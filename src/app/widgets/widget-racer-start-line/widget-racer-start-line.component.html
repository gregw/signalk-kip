<div class="line-wrapper"
  [style.--racer-color]="palette().color"
  [style.--racer-dim]="palette().dim">
  <div class="filler" #vizRef>
    <svg
      class="line-svg"
      [attr.viewBox]="'0 0 ' + vbWidth() + ' ' + VB_HEIGHT"
      preserveAspectRatio="xMidYMid meet">

      <text class="viz-title" x="8" y="8" dominant-baseline="hanging">{{ title() }}</text>

      @if (scene(); as s) {
        <!-- The line itself, drawn "line up": port (pin) end left, starboard (committee
             boat) end right, so the course side is always the upper half. -->
        <line class="start-line" [attr.x1]="s.portX" [attr.y1]="s.lineY"
          [attr.x2]="s.stbX" [attr.y2]="s.lineY" />

        <!-- Length and the heading to sail to cross the line, on the course side, with
             an arrow pointing the way to start. -->
        <text class="line-label" [attr.font-size]="s.labelFont"
          [attr.x]="s.labelX" [attr.y]="s.labelY">{{ s.label }}</text>
        <polygon class="line-arrow" [attr.points]="s.arrowPoints" />

        <!-- Both ends stand for a 10m object, drawn exaggerated so they stay legible. -->
        <circle class="port-mark" [attr.cx]="s.portX" [attr.cy]="s.lineY"
          [attr.r]="s.ends.pinRadius" />
        <!-- A rough committee boat: hull with a raked bow, plus a cabin. -->
        <polygon class="stb-mark" [attr.points]="s.ends.hull" />
        <rect class="stb-mark" [attr.x]="s.ends.cabin.x" [attr.y]="s.ends.cabin.y"
          [attr.width]="s.ends.cabin.width" [attr.height]="s.ends.cabin.height" />

        @for (p of s.projections; track $index) {
          <line class="projection" [class.best]="p.best"
            [attr.x1]="p.x1" [attr.y1]="p.y1" [attr.x2]="p.x2" [attr.y2]="p.y2"
            [attr.stroke-width]="p.width" [attr.stroke-opacity]="p.opacity">
            <title>{{ p.title }}</title>
          </line>
        }

        <!-- The hull outline: its inner edge is the vessel at true scale, so it can be
             measured against the line, while the stroke keeps it visible when small. -->
        @if (s.boat; as b) {
          <path class="boat" [class.ocs]="b.ocs" [attr.d]="b.path">
            <title>{{ b.title }}</title>
          </path>
        }

        <!-- VMG edit mode replaces the boat with the four best VMGs, laid out to match
             the drawing: the port end in the left third, the across-line pair stacked in
             the middle with the course side above, and the starboard end in the right. -->
        @if (s.vmgs; as vmgs) {
          @for (v of vmgs; track v.name) {
            @if (v.selected) {
              <rect class="vmg-selection"
                [attr.x]="v.box.x" [attr.y]="v.box.y"
                [attr.width]="v.box.width" [attr.height]="v.box.height"
                [attr.rx]="s.vmgFont * 0.16" />
            }
            <text class="vmg-value" [class.overridden]="v.overridden"
              [attr.font-size]="s.vmgFont" [attr.x]="v.x" [attr.y]="v.y">{{ v.text
              }}<title>{{ v.title }}</title></text>
          }
        }
      } @else {
        <text class="no-line" [attr.x]="vbWidth() / 2" [attr.y]="VB_HEIGHT / 2">No start line set</text>
      }
    </svg>
  </div>

  <div class="buttons-container">
    <button mat-flat-button class="button select-button" matTooltip="Select the control mode"
      (click)="toggleMode()">
      <mat-icon class="buttons-svg-icon">
        <svg width="100%" height="100%" viewBox="0 0 80 14" preserveAspectRatio="xMidYMid meet"
          class="svg-content">
          <text x="40" y="9">&vellip;</text>
        </svg>
      </mat-icon>
    </button>

    @if (mode() === 1) {
      <button mat-flat-button class="button vmg-button" [matTooltip]="vmgButtonTooltip()"
        (click)="cycleVmg()">
        <mat-icon class="buttons-svg-icon">
          <svg width="100%" height="100%" viewBox="0 0 80 14" preserveAspectRatio="xMidYMid meet"
            class="svg-content">
            <text x="40" y="11">{{ vmgButtonLabel() }}</text>
          </svg>
        </mat-icon>
      </button>
      <button mat-flat-button class="button adjust-button" [disabled]="!selectedVmg()"
        matTooltip="Decrease the selected best VMG" (click)="adjustVmg(-1)">
        <mat-icon class="buttons-svg-icon">
          <svg width="100%" height="100%" viewBox="0 0 60 14" preserveAspectRatio="xMidYMid meet"
            class="svg-content">
            <text x="30" y="11">&minus;{{ vmgStepLabel() }}</text>
          </svg>
        </mat-icon>
      </button>
      <button mat-flat-button class="button reset-button" [matTooltip]="vmgResetTooltip()"
        (click)="resetVmg()">
        <mat-icon class="buttons-svg-icon">
          <svg width="100%" height="100%" viewBox="0 0 30 14" preserveAspectRatio="xMidYMid meet"
            class="svg-content">
            <text x="15" y="11">=</text>
          </svg>
        </mat-icon>
      </button>
      <button mat-flat-button class="button adjust-button" [disabled]="!selectedVmg()"
        matTooltip="Increase the selected best VMG" (click)="adjustVmg(1)">
        <mat-icon class="buttons-svg-icon">
          <svg width="100%" height="100%" viewBox="0 0 60 14" preserveAspectRatio="xMidYMid meet"
            class="svg-content">
            <text x="30" y="11">+{{ vmgStepLabel() }}</text>
          </svg>
        </mat-icon>
      </button>
    }
  </div>

  @if (!dashboard.isDashboardStatic()) {
    <div class="widgetOverlay"></div>
  }
</div>
